services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clinicaltrial-web
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8080}
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - prescreening-net

  api:
    build:
      context: ./backend/ClinicalTrialPreScreening.Api
      dockerfile: Dockerfile
    container_name: clinicaltrial-api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:8080
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-latest}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - EMBEDDING_SERVICE_URL=${EMBEDDING_SERVICE_URL:-http://embedding-service:8001}
      - SQLSERVER_HOST=${SQLSERVER_HOST:-sqlserver}
      - SQLSERVER_PORT=${SQLSERVER_PORT:-1433}
      - SQLSERVER_DATABASE=${SQLSERVER_DATABASE:-ClinicalTrialPreScreening}
      - SQLSERVER_USER=${SQLSERVER_USER:-sa}
      - SQLSERVER_PASSWORD=${SQLSERVER_PASSWORD}
      - SQLSERVER_TRUST_CERTIFICATE=${SQLSERVER_TRUST_CERTIFICATE:-true}
      - SQLSERVER_ENCRYPT=${SQLSERVER_ENCRYPT:-false}
      - CONNECTION_STRING=${CONNECTION_STRING}
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/data/uploads}
      - EXPORT_DIR=${EXPORT_DIR:-/app/data/exports}
      - USE_FALLBACK_DEMO_MODE=${USE_FALLBACK_DEMO_MODE:-false}
    volumes:
      - api-data:/app/data
      - ./sample-data:/app/sample-data:ro
    depends_on:
      sqlserver:
        condition: service_healthy
      qdrant:
        condition: service_started
      embedding-service:
        condition: service_healthy
    healthcheck:
      # No curl/wget in the base image and no package-mirror access in this
      # environment; a bash /dev/tcp check confirms the port is listening.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - prescreening-net

  embedding-service:
    build:
      context: ./embedding-service
      dockerfile: Dockerfile
    container_name: clinicaltrial-embedding-service
    ports:
      - "8001:8001"
    healthcheck:
      # Python is guaranteed present in this image; use it to hit /health
      # directly instead of relying on curl/wget (unavailable, no apt access).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      # Generous retry budget: sentence-transformers downloads the
      # all-MiniLM-L6-v2 model on first run, which can take minutes on a slow
      # connection (see README/CODESETUP "embedding model first-run delay").
      retries: 24
      start_period: 60s
    networks:
      - prescreening-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: clinicaltrial-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # Best-effort TCP check (qdrant's base image has no curl/wget). If the
      # image lacks bash, this check will report unhealthy; depends_on below
      # uses service_started for qdrant so that does not block api startup.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - prescreening-net

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: clinicaltrial-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQLSERVER_PASSWORD}
      - MSSQL_PID=Developer
      - SQLSERVER_PASSWORD=${SQLSERVER_PASSWORD}
    ports:
      # If host port 1433 is already in use, change to "11433:1433" and see
      # README.md / CODESETUP.md for the SSMS connection alternative. The api
      # container always connects to sqlserver,1433 regardless of this mapping.
      - "11433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # mssql-tools path differs across image builds; try both locations.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SQLSERVER_PASSWORD\" -C -N -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$SQLSERVER_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      # Generous retry budget: first-run SQL Server data directory
      # initialization can take longer than 10 retries on constrained hosts.
      retries: 15
      start_period: 30s
    networks:
      - prescreening-net

networks:
  prescreening-net:
    driver: bridge

volumes:
  sqlserver-data:
  qdrant-data:
  api-data:
